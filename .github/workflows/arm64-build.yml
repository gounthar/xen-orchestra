---
name: arm64 build probe
# Fork-only probe: does XO build from sources on arm64, and which native
# modules does it pull in? Mirrors the install/build steps of ci.yml.
on:
  push:
    branches: [ci/arm64-build, ci/arm64-fuse-swap]
  workflow_dispatch:

# An explicit `shell: bash` makes GitHub run steps with -eo pipefail, so a
# failing command piped into tee fails the step instead of hiding behind
# tee's exit status (the first run reported success with yarn failing).
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl qemu-utils python3-vmdkstream git \
            libxml2-utils libfuse2 nbdkit open-iscsi \
            libfuse-dev pkg-config

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.12'
          cache: 'yarn'

      - name: Report platform
        run: |
          uname -a
          node -p "process.platform + ' ' + process.arch + ' ' + process.version"
          nproc

      - name: Install project dependencies
        run: /usr/bin/time -v yarn 2>&1 | tee install.log

      - name: Build the project
        run: /usr/bin/time -v yarn build 2>&1 | tee build.log

      - name: FUSE mount test (fuse-vhd, as file-level restore does)
        run: |
          set -x
          sudo modprobe fuse || true
          ls -l /dev/fuse
          work=$(mktemp -d)
          mkdir -p "$work/remote" "$work/mnt" "$work/ro"
          # 64 MiB ext4 image with one known file
          truncate -s 64M "$work/disk.raw"
          mkfs.ext4 -q -F "$work/disk.raw"
          sudo mount -o loop "$work/disk.raw" "$work/ro"
          echo "hello from $(uname -m) at $(date -u +%FT%TZ)" \
            | sudo tee "$work/ro/probe.txt"
          sudo umount "$work/ro"
          # dynamic VHD, exact size (no CHS rounding)
          qemu-img convert -f raw -O vpc \
            -o subformat=dynamic,force_size=on \
            "$work/disk.raw" "$work/remote/disk.vhd"
          qemu-img info "$work/remote/disk.vhd"
          # mount through the same module xo-server uses, as root
          sudo "$(command -v node)" @vates/fuse-vhd/cli.mjs \
            "file://$work/remote" disk.vhd "$work/mnt" &
          cli=$!
          for i in $(seq 1 60); do
            sudo test -e "$work/mnt/vhd0" && break
            sleep 1
          done
          mount | grep fuse
          sudo ls -l "$work/mnt"
          # FUSE view must be byte-identical to the source image; read it as
          # root: a root FUSE mount without allow_other refuses other users
          a=$(sha256sum < "$work/disk.raw" | cut -d' ' -f1)
          b=$(sudo sha256sum "$work/mnt/vhd0" | cut -d' ' -f1)
          echo "raw=$a fuse=$b"
          test "$a" = "$b"
          # and the filesystem inside it must read back
          sudo mount -o ro,loop,norecovery "$work/mnt/vhd0" "$work/ro"
          sudo cat "$work/ro/probe.txt"
          sudo umount "$work/ro"
          sudo kill -INT "$cli" || true
          wait "$cli" || true
          echo "FUSE mount test: PASS"

      - name: Inventory native modules
        if: always()
        run: |
          {
            echo "## binding.gyp (compiled from source)"
            find node_modules packages @xen-orchestra @vates -name binding.gyp \
              -not -path '*/test/*' 2>/dev/null | sort
            echo
            echo "## .node binaries"
            find node_modules packages @xen-orchestra @vates -name '*.node' \
              2>/dev/null | sort
            echo
            echo "## fuse-native load test"
            node -e "require('fuse-native'); console.log('fuse-native: loads')" \
              2>&1 || true
            echo
            echo "## fuse-native resolved package"
            node -p "require('fuse-native/package.json').name + '@' + require('fuse-native/package.json').version" \
              2>&1 || true
            echo
            echo "## @vates/fuse-vhd load test"
            node -e "import('@vates/fuse-vhd').then(() => console.log('@vates/fuse-vhd: loads'))" \
              2>&1 || true
          } | tee native-inventory.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.runner }}
          path: |
            install.log
            build.log
            native-inventory.txt
